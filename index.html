<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReadyHire — Call-center &amp; customer-service jobs</title>
<style>
  :root { --bg:#FCFAF7; --card:#fff; --ink:#14110D; --ink-2:#5A5147; --ink-3:#8B8378; --line:#EFE8DE; --accent:#D9552B; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,sans-serif; line-height:1.6; text-align:center; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 20px; }
  img { width:88px; height:88px; }
  h1 { font-size:34px; letter-spacing:-.035em; margin:20px 0 6px; }
  p { color:var(--ink-2); font-size:16px; }
  .links { margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  a.btn { text-decoration:none; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:700; padding:10px 18px; border-radius:12px; }
  footer { margin-top:48px; color:var(--ink-3); font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="./logo.svg" alt="ReadyHire" />
    <h1>ReadyHire</h1>
    <p>A free, bilingual (English / Arabic) marketplace for call-center and customer-service jobs — connecting job seekers with recruiters across Egypt.</p>
    <div class="links">
      <a class="btn" href="./privacy.html">Privacy Policy</a>
      <a class="btn" href="./terms.html">Terms of Service</a>
      <a class="btn" href="mailto:readyhire48@gmail.com">Contact</a>
    </div>
    <footer>© 2026 ReadyHire</footer>
  </div>
</body>
</html>
